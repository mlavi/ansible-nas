[defaults]
retry_files_enabled = False
# https://docs.ansible.com/projects/ansible/latest/plugins/callback.html#types-of-callback-plugins
# https://stackoverflow.com/questions/50009505/formatting-stdout-in-a-debug-task-of-ansible
callback_result_format = json
# yaml is easier to read, but some output parsing requires json

# fact caching
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/facts_cache
# two hour timeout 
fact_caching_timeout = 7200

# vault
ask_vault_pass=False
vault_password_file=${ANSIBLE_INVENTORY}/vault/vault.ignore.txt



